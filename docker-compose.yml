services:
  # Base de datos PostgreSQL — tienda deportiva
  # Puerto 5433 en el host para no chocar con otros proyectos (teslo-shop, etc.)
  db:
    image: postgres:15.3
    container_name: tienda-deportiva-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - tienda_deportiva_pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Aplica las migraciones de Prisma y termina
  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    depends_on:
      db:
        condition: service_healthy
    profiles: ["app"]

  # Aplicación Next.js (producción)
  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_PAYPAL_CLIENT_ID: ${NEXT_PUBLIC_PAYPAL_CLIENT_ID}
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      AUTH_TRUST_HOST: "true"
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: ["app"]

volumes:
  # Volumen nombrado: los datos persisten aunque se borre el contenedor
  tienda_deportiva_pgdata:
